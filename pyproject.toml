[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tgrep"
version = "0.1.0"
description = "Time-aware grep for log analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
tgrep = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
